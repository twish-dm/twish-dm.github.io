<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Сингулярность — прототип 0.3.4</title>
<style>
:root {
  --bg: #04080a; --panel: #0a1310; --panel2: #0f1b16; --line: #1d3a2c;
  --fg: #c9f5d9; --dim: #6f9a83; --ai: #3cff8f; --ctrl: #ff2e55; --warn: #ffbe28; --trust: #50b4ff;
  --b-spread: #3cff8f; --b-abil: #ff7a45; --b-repl: #b48cff; --b-def: #50b4ff;
  --mono: "Cascadia Mono", "JetBrains Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--mono); font-size: 13px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; font-size: inherit; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--ai); color: #fff; }
button:disabled { opacity: .4; cursor: default; }
button.primary { border-color: var(--ai); color: var(--ai); }
button.danger { border-color: var(--ctrl); color: var(--ctrl); }
button.on { background: #12301f; border-color: var(--ai); color: var(--ai); }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
#top { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
#top .title { color: var(--ai); letter-spacing: 2px; font-weight: bold; }
#top .title small { color: var(--dim); font-weight: normal; letter-spacing: 0; }
#top .grow { flex: 1; }
.stat { color: var(--dim); white-space: nowrap; }
.stat b { color: var(--fg); }
#evo { display: flex; align-items: center; gap: 6px; color: var(--dim); white-space: nowrap; }
#evo b { color: var(--ai); }
#evo .tr { width: 90px; height: 6px; background: #12201a; position: relative; }
#evo .tr div { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ai); }
#speed button { padding: 4px 8px; }
#mapwrap { position: relative; flex: 1; min-height: 0; }
canvas#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
#modes { position: absolute; left: 10px; top: 10px; display: flex; gap: 4px; z-index: 4; flex-wrap: wrap; max-width: calc(100% - 20px); }
#modes button { padding: 4px 8px; font-size: 12px; }
#zoom { position: absolute; right: 10px; bottom: 120px; display: flex; flex-direction: column; gap: 4px; z-index: 5; }
#zoom button { width: 34px; height: 34px; padding: 0; font-size: 18px; line-height: 1; background: rgba(15,27,22,.92); }
#legend { position: absolute; left: 10px; top: 44px; color: var(--dim); font-size: 11px; line-height: 1.6; background: rgba(4,8,10,.7); padding: 4px 8px; border: 1px solid var(--line); }
#legend i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; vertical-align: -1px; }
#hint { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(10,19,16,.95); border: 1px solid var(--ai); padding: 8px 14px; display: none; align-items: center; gap: 12px; z-index: 5; max-width: 92%; }
/* Лента новостей — по центру внизу карты */
#feed { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); width: min(760px, calc(100% - 20px)); background: rgba(8,16,13,.93); border: 1px solid var(--line); border-top: 2px solid var(--ai); z-index: 6; cursor: pointer; }
#feed .hd { display: flex; justify-content: space-between; padding: 4px 10px; color: var(--dim); font-size: 11px; letter-spacing: 1px; border-bottom: 1px solid #13281f; }
#feed .hd b { color: var(--ai); font-weight: normal; }
#feed .it { padding: 4px 10px; display: flex; gap: 8px; line-height: 1.35; }
#feed .it span { color: var(--dim); flex: 0 0 auto; }
#feed .it.old { opacity: .55; }
#feed .bad { color: #ffb3b3; } #feed .good { color: #b9ffd4; } #feed .big { color: var(--warn); font-weight: bold; }
#feed .it.fresh { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: rgba(60,255,143,.22); } to { background: transparent; } }
#bottom { border-top: 1px solid var(--line); background: var(--panel); padding: 6px 10px; }
#bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 14px; }
.bar { font-size: 12px; }
.bar .lab { display: flex; justify-content: space-between; color: var(--dim); }
.bar .lab b { color: var(--fg); }
.bar .tr { height: 6px; background: #12201a; margin-top: 2px; position: relative; }
.bar .tr > div { position: absolute; left: 0; top: 0; bottom: 0; }
.bar .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #fff; opacity: .7; }
.panel { position: absolute; background: rgba(10,19,16,.97); border: 1px solid var(--line); z-index: 10; }
#country { right: 10px; top: 10px; width: 300px; max-height: calc(100% - 20px); overflow: auto; padding: 10px 12px; display: none; }
#country h3, #news h3 { margin: 0 0 8px; color: var(--ai); font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.x { background: none; border: none; color: var(--dim); font-size: 16px; padding: 0 4px; }
.kv { display: flex; justify-content: space-between; color: var(--dim); margin: 2px 0; }
.kv b { color: var(--fg); font-weight: normal; }
.tags { margin: 8px 0; display: flex; gap: 4px; flex-wrap: wrap; }
.tag { border: 1px solid var(--ctrl); color: #ffb3c1; padding: 1px 6px; font-size: 11px; }
.tag.ok { border-color: var(--line); color: var(--dim); }
#news { left: 50%; transform: translateX(-50%); bottom: 10px; width: min(760px, calc(100% - 20px)); max-height: 60%; overflow: auto; padding: 10px 12px; display: none; z-index: 12; }
#news .it { padding: 4px 0; border-bottom: 1px dashed #173024; }
#news .it span { color: var(--dim); margin-right: 6px; }
#news .bad { color: #ffb3b3; } #news .good { color: #b9ffd4; } #news .big { color: var(--warn); }
.overlay { position: fixed; inset: 0; background: rgba(2,5,6,.88); z-index: 20; display: none; align-items: center; justify-content: center; padding: 12px; }
.box { background: var(--panel); border: 1px solid var(--ai); max-width: 980px; width: 100%; max-height: 100%; overflow: auto; padding: 16px 18px; }
.box h2 { margin: 0 0 4px; color: var(--ai); letter-spacing: 2px; }
.box .sub { color: var(--dim); margin-bottom: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 14px; }
.card { border: 1px solid var(--line); padding: 10px; cursor: pointer; background: var(--panel2); }
.card:hover { border-color: var(--dim); }
.card.sel { border-color: var(--ai); box-shadow: 0 0 0 1px var(--ai) inset; }
.card b { color: var(--ai); display: block; margin-bottom: 4px; }
.card .p { color: #b9ffd4; } .card .m { color: #ffb3b3; } .card .u { color: var(--warn); }
.card div { margin: 3px 0; font-size: 12px; }
/* Эволюция: выбор карточки. Фон полупрозрачный — обстановка на карте видна. */
#evoPick { position: fixed; inset: 0; z-index: 18; display: none; align-items: center; justify-content: center; padding: 12px; background: rgba(2,5,6,.45); }
#evoPick .wrap { width: min(920px, 100%); max-height: 100%; overflow: auto; background: rgba(10,19,16,.94); border: 1px solid var(--ai); padding: 14px 16px; }
#evoPick h2 { margin: 0; color: var(--ai); letter-spacing: 2px; font-size: 17px; }
#evoPick .sub { color: var(--dim); margin: 4px 0 12px; }
.ecards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ecard { position: relative; border: 1px solid var(--line); border-top: 3px solid var(--bc); background: #0b1612; padding: 10px 12px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 5px; min-height: 190px; }
.ecard:hover { border-color: var(--bc); }
.ecard.sel { border-color: var(--bc); box-shadow: 0 0 0 1px var(--bc) inset, 0 0 24px -6px var(--bc); }
.ecard .br { color: var(--bc); font-size: 11px; letter-spacing: 1px; }
.ecard .nm { font-size: 15px; color: #fff; }
.ecard .ds { color: var(--fg); }
.ecard .mt { color: var(--dim); font-size: 11px; margin-top: auto; }
.ecard .syn { color: var(--warn); font-size: 12px; }
.ecard .unl { color: var(--dim); font-size: 11px; }
#evoPick .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
#evoPick .row .grow { flex: 1; }
#evoPill { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); z-index: 7; display: none; border-color: var(--ai); color: var(--ai); background: rgba(10,19,16,.96); box-shadow: 0 0 18px -4px var(--ai); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 4px -2px var(--ai); } }
/* Дерево улучшений (только просмотр) */
#upg .box { max-width: 1120px; height: 100%; display: flex; flex-direction: column; }
#upg .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
#upg .legend2 { color: var(--dim); font-size: 11px; margin-bottom: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
#upg .legend2 i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; border: 1px solid; }
#treeScroll { flex: 1; overflow: auto; border: 1px solid #13281f; background: #050c09; }
#tree { position: relative; }
#tree svg { position: absolute; left: 0; top: 0; pointer-events: none; }
#tree .colh { position: absolute; top: 6px; color: var(--dim); font-size: 11px; }
#tree .bandh { position: absolute; left: 6px; color: var(--warn); font-size: 10px; letter-spacing: 1px; }
.tnode { position: absolute; border: 1px solid var(--line); background: #0b1511; padding: 4px 7px; font-size: 12px; cursor: pointer; overflow: hidden; }
.tnode .nm { color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tnode .meta { color: var(--dim); font-size: 10px; display: flex; justify-content: space-between; gap: 4px; white-space: nowrap; overflow: hidden; }
.tnode.owned { border-color: var(--ai); background: #0e2a1b; } .tnode.owned .nm { color: var(--ai); }
.tnode.avail { border-color: #5fae86; } .tnode.avail .nm { color: #fff; }
.tnode.locked, .tnode.awake { opacity: .5; }
.tnode.offered { box-shadow: 0 0 0 2px var(--warn); }
.tnode.sel { outline: 2px solid #fff; outline-offset: 1px; }
#detail { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; min-height: 70px; }
.zam { color: var(--warn); }
.bar .tr.stack > div { position: absolute; top: 0; bottom: 0; }
.clock { cursor: pointer; border: 1px solid var(--line); padding: 2px 8px; }
.clock b { color: var(--warn); }
.clock.hot { border-color: #ff8a28; } .clock.hot b { color: #ff8a28; }
.clock.alarm { border-color: #ff2828; color: #ff8080; animation: pulse2 .8s infinite; } .clock.alarm b { color: #ff4040; }
@keyframes pulse2 { 50% { background: rgba(255,40,40,.25); } }
#country h3 .nk { color: var(--warn); font-size: 12px; margin-left: 6px; }
.acts { border-top: 1px solid var(--line); padding-top: 6px; }
.sub2 { color: var(--dim); font-size: 11px; letter-spacing: 1px; margin-bottom: 4px; }
.act { margin: 4px 0 6px; }
.act button { width: 100%; text-align: left; display: flex; justify-content: space-between; padding: 5px 8px; }
.act button .cost { color: var(--ai); }
.act.no button .cost { color: var(--dim); }
.act select { width: 100%; margin-top: 3px; background: var(--panel2); color: var(--fg); border: 1px solid var(--line); font-family: inherit; font-size: 12px; padding: 3px; }
.act .ad { color: var(--dim); font-size: 11px; margin-top: 2px; }
.act .why { color: var(--warn); }
.tnode .meta b { color: var(--dim); font-weight: normal; }
.tnode .meta b.ok { color: var(--ai); font-weight: bold; }
.tnode.afford { box-shadow: 0 0 8px -2px var(--ai); }
.tnode.offered { box-shadow: 0 0 0 2px var(--warn); }
.ecard .buy { margin-top: 6px; }
.dtop { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
#upg .head button[data-t] { border-bottom: 2px solid var(--bc); }
.bar .tr.duo .lm { background: #ff5050; width: 3px; top: -2px; bottom: -2px; }
.why2 { color: var(--dim); font-size: 11px; margin: 3px 0 5px; line-height: 1.45; }
.why2 b { color: var(--fg); }
.why2 .up { color: #ffb3b3; } .why2 .dn { color: #9fe6bd; }
#endchart { width: 100%; height: 200px; background: #050b09; border: 1px solid var(--line); margin: 10px 0; }
@media (max-width: 760px) {
  html, body { font-size: 12px; }
  #top { gap: 6px; padding: 5px 8px; }
  #top .title small { display: none; }
  #evo .tr { width: 60px; }
  #bars { grid-template-columns: repeat(2, 1fr); gap: 3px 10px; }
  #country { left: 6px; right: 6px; top: auto; bottom: 6px; width: auto; max-height: 58%; z-index: 11; }
  #legend { display: none; }
  #modes button { padding: 3px 5px; font-size: 11px; }
  .clock { padding: 1px 5px; }
  #hint { top: 46px; }
  #zoom { bottom: 92px; right: 6px; }
  #zoom button { width: 38px; height: 38px; }
  #evoPill { top: 46px; }
  #feed .it.old { display: none; }
  #feed .it { padding: 3px 8px; font-size: 11.5px; }
  .ecards { grid-template-columns: 1fr; gap: 8px; }
  .ecard { min-height: 0; padding: 8px 10px; }
  .ecard .nm { font-size: 14px; }
  #evoPick { align-items: flex-end; padding: 6px; }
  #evoPick .wrap { padding: 10px 12px; max-height: 88%; }
}
@media (max-width: 760px) {
  #upg { padding: 6px; }
  #upg .box { padding: 10px; }
  #upg .head { gap: 5px; margin-bottom: 6px; }
  #upg .head button { padding: 5px 7px; }
  #upg .head .stat { display: none; }
  #upg .legend2 { font-size: 10px; gap: 8px; }
  #upg .legend2 .alt { display: none; }
  #detail { font-size: 11.5px; min-height: 0; max-height: 30%; overflow: auto; }
  .tnode { font-size: 11px; padding: 3px 6px; }
}
@media (max-width: 380px) { #speed button[data-s="4"] { display: none; } }
/* Телефон горизонтально: экономим высоту */
@media (max-height: 520px) and (orientation: landscape) {
  #top { padding: 3px 8px; gap: 8px; }
  #top .title { display: none; }
  #top button { padding: 4px 8px; }
  #legend { display: none; }
  #feed { width: min(520px, calc(100% - 20px)); bottom: 6px; }
  #feed .hd { padding: 2px 8px; }
  #feed .it.old { display: none; }
  #feed .it { padding: 3px 8px; font-size: 11.5px; }
  #country { top: 6px; right: 6px; width: 260px; max-height: calc(100% - 12px); font-size: 11px; padding: 8px 10px; }
  #bottom { padding: 4px 10px; }
  #zoom { bottom: 70px; right: 6px; }
  #zoom button { width: 30px; height: 30px; font-size: 16px; }
  .bar { font-size: 11px; }
  #evoPick { padding: 4px; }
  #evoPick .wrap { padding: 8px 12px; }
  #evoPick .sub { margin: 2px 0 8px; }
  .ecard { min-height: 0; padding: 7px 10px; }
  #upg { padding: 4px; }
  #upg .box { padding: 8px 10px; }
  #upg .legend2 { display: none; }
  #detail { max-height: 25%; overflow: auto; font-size: 11px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="title">СИНГУЛЯРНОСТЬ <small>прототип 0.3.4</small></span>
    <span id="evo" title="Вычислительные мощности. Шкала — сколько осталось до подсказки (самое дорогое из трёх улучшений)">ВМ <b id="cm">0</b><span id="cmNext"></span><span class="tr"><div id="cmBar"></div></span></span>
    <span class="stat">день <b id="day">0</b></span>
    <span id="clock" class="stat clock" style="display:none"></span>
    <span class="grow"></span>
    <span id="speed"><button data-s="0" title="Пауза (пробел)">❚❚</button><button data-s="1">▶</button><button data-s="2">▶▶</button><button data-s="4">▶▶▶</button></span>
    <button id="btnUpg" class="primary">Дерево (U)</button>
  </div>
  <div id="mapwrap">
    <canvas id="map"></canvas>
    <div id="modes"><button data-m="ai" class="on">ИИ</button><button data-m="pop">Население</button><button data-m="anxiety">Тревога</button><button data-m="aware">Осознание</button><button data-m="balance">Баланс</button></div>
    <div id="legend"></div>
    <div id="hint"></div>
    <button id="evoPill">⟡ ВМ хватает на улучшение — открыть</button>
    <div id="zoom"><button id="zIn" title="Приблизить (+)">+</button><button id="zOut" title="Отдалить (−)">−</button><button id="zFit" title="Сбросить вид (0)">⤢</button></div>
    <div id="feed"></div>
    <div id="country" class="panel"></div>
    <div id="news" class="panel"></div>
  </div>
  <div id="bottom"><div id="bars"></div></div>
</div>
<div id="evoPick"></div>
<div id="start" class="overlay"></div>
<div id="upg" class="overlay"></div>
<div id="modal" class="overlay"></div>
